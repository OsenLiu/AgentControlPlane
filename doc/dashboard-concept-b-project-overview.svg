  <rect x="258" y="521" width="1086" height="114" rx="12" class="panel"/><circle cx="292" cy="557" r="8" class="red"/><text x="316" y="560" class="sans ink" font-size="15" font-weight="700">website-redesign</text><text x="316" y="584" class="sans muted" font-size="13">develop · 2 tasks active · 1 agent running</text><rect x="904" y="546" width="120" height="28" rx="14" fill="#fff0f1"/><text x="929" y="565" class="sans red" font-size="12" font-weight="700">● Failed</text><text x="1080" y="562" class="sans ink" font-size="13">2 / 11 tasks</text><text x="1237" y="562" class="sans red" font-size="13">● build failed</text><rect x="316" y="607" width="490" height="5" rx="3" fill="#e8eef5"/><rect x="316" y="607" width="120" height="5" rx="3" fill="#e04f5f"/>
  <rect x="258" y="651" width="1086" height="114" rx="12" class="panel"/><circle cx="292" cy="687" r="8" class="green"/><text x="316" y="690" class="sans ink" font-size="15" font-weight="700">mobile-client</text><text x="316" y="714" class="sans muted" font-size="13">feature/sync · idle · looping mode on</text><rect x="904" y="676" width="120" height="28" rx="14" fill="#e6f8f0"/><text x="929" y="695" class="sans green" font-size="12" font-weight="700">● Healthy</text><text x="1080" y="692" class="sans ink" font-size="13">0 / 6 tasks</text><text x="1237" y="692" class="sans blue" font-size="13">↻ looping</text>
  <rect x="258" y="799" width="1086" height="64" rx="12" fill="#eef4ff"/><text x="286" y="827" class="sans blue" font-size="13" font-weight="700">Tip</text><text x="326" y="827" class="sans ink" font-size="13">Turn on looping mode for mobile-client to automatically work through its backlog.</text><text x="1188" y="827" class="sans blue" font-size="13" font-weight="700">Configure →</text>

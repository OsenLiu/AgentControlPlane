<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.ink{fill:#172033}.muted{fill:#708098}.line{stroke:#dbe3ee}.panel{fill:#fff;stroke:#dbe3ee}.blue{fill:#3267e3}.green{fill:#1eaa73}.orange{fill:#e58b2f}.red{fill:#e04f5f}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f5f7fb"/>
  <rect width="1440" height="74" fill="#ffffff"/><line x1="0" y1="74" x2="1440" y2="74" class="line"/>
  <text x="42" y="45" class="sans ink" font-size="21" font-weight="800">Agent Control Plane</text><text x="282" y="44" class="sans muted" font-size="14">Workspace overview</text>
  <rect x="1112" y="20" width="132" height="35" rx="8" fill="#edf2ff"/><text x="1135" y="42" class="sans blue" font-size="13" font-weight="700">⌕ Search</text><circle cx="1300" cy="37" r="17" fill="#d9e3f7"/><text x="1294" y="42" class="sans ink" font-size="13" font-weight="700">A</text>
  <rect x="0" y="74" width="220" height="826" fill="#ffffff"/><text x="30" y="122" class="sans muted" font-size="11" font-weight="700">WORKSPACE</text><rect x="18" y="144" width="184" height="40" rx="8" fill="#edf2ff"/><text x="40" y="169" class="sans blue" font-size="14" font-weight="700">▦  Dashboard</text><text x="40" y="220" class="sans muted" font-size="14">▱  All projects</text><text x="40" y="266" class="sans muted" font-size="14">◌  Sessions</text><text x="40" y="312" class="sans muted" font-size="14">⚑  Inbox <tspan class="blue" font-weight="700">4</tspan></text><text x="40" y="358" class="sans muted" font-size="14">⌁  Pipelines</text><line x1="30" y1="400" x2="190" y2="400" class="line"/><text x="30" y="436" class="sans muted" font-size="11" font-weight="700">PROJECTS</text><text x="40" y="476" class="sans ink" font-size="14">● agent-control-plane</text><text x="40" y="518" class="sans ink" font-size="14">● website-redesign</text><text x="40" y="560" class="sans ink" font-size="14">● mobile-client</text><text x="40" y="848" class="sans blue" font-size="13" font-weight="600">＋ Add project</text>

  <text x="258" y="132" class="sans ink" font-size="28" font-weight="800">Dashboard</text><text x="258" y="160" class="sans muted" font-size="14">A calm view of everything your agents are doing.</text>
  <rect x="1172" y="112" width="172" height="38" rx="8" fill="#3267e3"/><text x="1201" y="136" class="sans" fill="#fff" font-size="13" font-weight="700">＋ Delegate task</text>
  <rect x="258" y="193" width="340" height="126" rx="12" class="panel"/><text x="282" y="226" class="sans muted" font-size="12" font-weight="700">NEEDS YOUR ATTENTION</text><text x="282" y="273" class="sans ink" font-size="38" font-weight="800">4</text><text x="349" y="270" class="sans orange" font-size="14" font-weight="600">items waiting</text><text x="282" y="300" class="sans blue" font-size="13">Review, answer, or resume →</text>

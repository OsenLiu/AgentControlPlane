name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set app version from tag
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.replace(/^v/, "");

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Tag ${tag} must use a version like v1.2.3`);
          }

          for (const path of ["package.json", "package-lock.json", "src-tauri/tauri.conf.json"]) {
            const metadata = JSON.parse(fs.readFileSync(path, "utf8"));
            metadata.version = version;
            if (path === "package-lock.json" && metadata.packages?.[""]) {
              metadata.packages[""].version = version;
            }
            fs.writeFileSync(path, `${JSON.stringify(metadata, null, 2)}\n`);
          }

          const cargoPath = "src-tauri/Cargo.toml";
          const cargoManifest = fs.readFileSync(cargoPath, "utf8");
          const updatedManifest = cargoManifest.replace(
            /^(\[package\][\s\S]*?^version = ")[^"]+(")/m,
            `$1${version}$2`,
          );
          if (updatedManifest === cargoManifest) {
            throw new Error(`Could not update the package version in ${cargoPath}`);
          }
          fs.writeFileSync(cargoPath, updatedManifest);

          const cargoLockPath = "src-tauri/Cargo.lock";
          const cargoLock = fs.readFileSync(cargoLockPath, "utf8");
          const updatedLock = cargoLock.replace(
            /(\[\[package\]\]\r?\nname = "agent-control-plane"\r?\nversion = ")[^"]+(")/,
            `$1${version}$2`,
          );
          if (updatedLock === cargoLock) {
            throw new Error(`Could not update the package version in ${cargoLockPath}`);
          }
          fs.writeFileSync(cargoLockPath, updatedLock);
          NODE

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agent Control Plane ${{ github.ref_name }}
          releaseBody: See the assets below to download and install Agent Control Plane.
          releaseDraft: false
          prerelease: false
